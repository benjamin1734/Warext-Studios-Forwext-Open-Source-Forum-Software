[program:forwext-webhook-worker]
command=/bin/sh /var/www/forwext/deploy/advanced/scripts/webhook-worker-loop.sh
directory=/var/www/forwext
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/forwext/webhook-worker.log
stderr_logfile=/var/log/forwext/webhook-worker-error.log
environment=FORWEXT_WEBHOOK_WORKER_LIMIT="100",FORWEXT_WORKER_IDLE_SLEEP="2"
