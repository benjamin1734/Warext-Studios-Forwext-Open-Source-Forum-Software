name: MySQL migration smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: forwext_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Resolve development dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run clean MySQL migration smoke test
        env:
          FORWEXT_TEST_DB_HOST: 127.0.0.1
          FORWEXT_TEST_DB_PORT: 3306
          FORWEXT_TEST_DB_NAME: forwext_ci
          FORWEXT_TEST_DB_USER: root
          FORWEXT_TEST_DB_PASSWORD: root
        run: php tools/quality/smoke-core-migrations.php
