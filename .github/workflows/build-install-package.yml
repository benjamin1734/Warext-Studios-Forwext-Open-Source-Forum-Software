name: Build installation package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, pdo, pdo_mysql, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Resolve development dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Enforce strict types
        run: php tools/quality/check-strict-types.php

      - name: Run PHPUnit on PHP 8.4
        run: vendor/bin/phpunit --configuration=phpunit.xml.dist

      - name: Setup PHP 8.5 compatibility runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: openssl, pdo, pdo_mysql, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Run PHPUnit on PHP 8.5
        run: vendor/bin/phpunit --configuration=phpunit.xml.dist

      - name: Build production vendor tree against PHP 8.4.0 baseline
        shell: bash
        run: |
          set -euo pipefail
          php -r '
          $data = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
          unset($data["require-dev"], $data["autoload-dev"], $data["scripts"]);
          $data["config"] ??= [];
          $data["config"]["platform"] ??= [];
          $data["config"]["platform"]["php"] = "8.4.0";
          file_put_contents(
              "composer.production.json",
              json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR) . PHP_EOL
          );
          '
          rm -rf vendor composer.production.lock
          COMPOSER=composer.production.json composer update --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Verify production dependencies keep PHP 8.4.0 minimum
        shell: bash
        run: |
          set -euo pipefail
          php -r '
          $file = __DIR__ . "/vendor/composer/platform_check.php";
          $content = file_get_contents($file);
          if ($content === false) { fwrite(STDERR, "platform_check.php missing\n"); exit(1); }
          preg_match_all("/PHP_VERSION_ID\\s*>=\\s*(\\d+)/", $content, $matches);
          foreach ($matches[1] as $minimum) {
              if ((int) $minimum > 80400) {
                  fwrite(STDERR, "Production dependency minimum exceeds PHP 8.4.0: {$minimum}\n");
                  exit(1);
              }
          }
          require __DIR__ . "/vendor/autoload.php";
          '

      - name: Build cPanel full installation package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          ROOT="forwext-${VERSION}"
          mkdir -p "dist/${ROOT}"
          rsync -a ./ "dist/${ROOT}/" \
            --exclude '/.htaccess' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'tools/' \
            --exclude 'node_modules/' \
            --exclude 'composer*.json' \
            --exclude 'composer*.lock' \
            --exclude 'phpunit.xml.dist' \
            --exclude 'phpstan.neon.dist' \
            --exclude 'psalm.xml' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'PROJECT_STATUS.md'

          GUARD='Options -Indexes
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order allow,deny
              Deny from all
          </IfModule>'

          for dir in app core config database modules packages resources storage themes vendor; do
            if [ -d "dist/${ROOT}/${dir}" ]; then
              printf '%s\n' "$GUARD" > "dist/${ROOT}/${dir}/.htaccess"
            fi
          done

          (
            cd dist
            zip -rq "forwext-${VERSION}-install.zip" "${ROOT}"
            sha256sum "forwext-${VERSION}-install.zip" > "forwext-${VERSION}-install.zip.sha256"
          )

      - name: Build differential update package
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          CURRENT_TAG="v${VERSION}"
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous release tag found; update package will be skipped."
            exit 0
          fi

          FROM_VERSION="${PREVIOUS_TAG#v}"
          WORK="dist/update-work"
          PREVIOUS_DIR="${WORK}/previous-release"
          OLD_UNPACK="${WORK}/old"
          NEW_UNPACK="${WORK}/new"
          UPDATE_ROOT="${WORK}/payload"
          mkdir -p "$PREVIOUS_DIR" "$OLD_UNPACK" "$NEW_UNPACK" "$UPDATE_ROOT"

          gh release download "$PREVIOUS_TAG" \
            --pattern 'forwext-*-install.zip' \
            --dir "$PREVIOUS_DIR"

          PREVIOUS_ZIP="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name 'forwext-*-install.zip' | head -n 1)"
          if [ -z "$PREVIOUS_ZIP" ]; then
            echo "Previous installation ZIP was not found for ${PREVIOUS_TAG}." >&2
            exit 1
          fi

          unzip -q "$PREVIOUS_ZIP" -d "$OLD_UNPACK"
          unzip -q "dist/forwext-${VERSION}-install.zip" -d "$NEW_UNPACK"

          OLD_ROOT="$(find "$OLD_UNPACK" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          NEW_ROOT="$(find "$NEW_UNPACK" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$OLD_ROOT" ] || [ -z "$NEW_ROOT" ]; then
            echo "Could not determine package roots." >&2
            exit 1
          fi

          export OLD_ROOT NEW_ROOT UPDATE_ROOT FROM_VERSION VERSION
          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import shutil
          from pathlib import Path

          old_root = Path(os.environ["OLD_ROOT"])
          new_root = Path(os.environ["NEW_ROOT"])
          update_root = Path(os.environ["UPDATE_ROOT"])
          from_version = os.environ["FROM_VERSION"]
          to_version = os.environ["VERSION"]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def inventory(root: Path) -> dict[str, dict[str, object]]:
              result: dict[str, dict[str, object]] = {}
              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise RuntimeError(f"Release package must not contain symlinks: {path}")
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root).as_posix()
                  result[relative] = {
                      "path": path,
                      "sha256": sha256(path),
                  }
              return result

          old_files = inventory(old_root)
          new_files = inventory(new_root)
          update_root.mkdir(parents=True, exist_ok=True)

          changed = 0
          for relative, metadata in new_files.items():
              old_metadata = old_files.get(relative)
              if old_metadata is not None and old_metadata["sha256"] == metadata["sha256"]:
                  continue

              destination = update_root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(metadata["path"], destination)
              changed += 1

          deleted = sorted(set(old_files) - set(new_files))
          print(f"Update from {from_version} to {to_version}: {changed} add/replace, {len(deleted)} delete")
          if deleted:
              print("Deleted packaged files (report to the user; do not add helper files to the ZIP):")
              for relative in deleted:
                  print(f"DELETE: {relative}")
          PY

          (
            cd "$UPDATE_ROOT"
            zip -rq "../../forwext-${VERSION}-update.zip" .
          )
          (
            cd dist
            sha256sum "forwext-${VERSION}-update.zip" > "forwext-${VERSION}-update.zip.sha256"
          )

      - name: Upload release packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: forwext-release-packages
          path: |
            dist/forwext-*-install.zip
            dist/forwext-*-install.zip.sha256
            dist/forwext-*-update.zip
            dist/forwext-*-update.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          TITLE="Forwext ${VERSION}"
          ZIP="dist/forwext-${VERSION}-install.zip"
          SHA="dist/forwext-${VERSION}-install.zip.sha256"
          UPDATE_ZIP="dist/forwext-${VERSION}-update.zip"
          UPDATE_SHA="dist/forwext-${VERSION}-update.zip.sha256"
          NOTES="dist/release-notes.md"
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | grep -Fxv "$TAG" | head -n 1 || true)"
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"

          cat > "$NOTES" <<EOF
          ## Forwext ${VERSION}

          Development release generated from the tested \`main\` branch.

          - PHP 8.4.0+ minimum, PHP 8.5 compatibility tested
          - Production dependencies are resolved separately against a PHP 8.4.0 platform baseline
          - Full cPanel installation package: \`forwext-${VERSION}-install.zip\`
          - Differential update package from ${PREVIOUS_VERSION}: \`forwext-${VERSION}-update.zip\`
          - Update ZIP contains only real added/changed site files; no update/delete/readme/manifest helper files are injected
          - Any obsolete packaged files are reported separately and are not represented by files inside the ZIP
          - Root \`.htaccess\` is not overwritten by the full package, preserving cPanel/EA-PHP handlers
          - Production Composer dependencies are bundled in \`vendor/\`
          - This is a development prerelease, not Forwext 1.0.0
          EOF

          ASSETS=("$ZIP" "$SHA")
          if [ -f "$UPDATE_ZIP" ]; then
            ASSETS+=("$UPDATE_ZIP" "$UPDATE_SHA")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --prerelease
          fi
