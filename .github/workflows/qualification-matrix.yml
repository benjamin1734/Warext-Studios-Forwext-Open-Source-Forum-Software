name: Qualification test matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ format('forwext-qualification-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  php-contracts:
    name: PHP ${{ matrix.php }} qualification contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, pdo, pdo_mysql, mbstring, intl, zip
          coverage: none
          tools: composer:v2

      - name: Resolve development dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Unit and integration qualification
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/Core/Application
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/Core/Migration
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/Core/Update

      - name: Versioned API qualification
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/App/Web/Api
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/Core/Api
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/Core/Extension/ExtensionApiSecurityContractTest.php

      - name: Native browser and web-surface qualification
        run: vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/App/Web

      - name: First-party module ON/OFF contracts
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/Core/Module/FirstPartyModuleRuntimeMiddlewareTest.php
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/App/Web/FirstPartyModuleManagerWebSurfaceTest.php

      - name: Sample add-on compatibility contract
        run: vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit/Core/Addon/SampleAddonContractTest.php

      - name: Architecture and security regression qualification
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Architecture
          vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Security


  browser-regression:
    name: Chromium responsive and live-route accessibility smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: forwext_browser_ci
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, pdo, pdo_mysql, mbstring, intl, zip
          coverage: none
          tools: composer:v2

      - name: Resolve PHP development dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve browser tooling
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render representative shell fixtures
        run: npm run browser:fixtures

      - name: Start local fixture server
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8123 -t . >/tmp/forwext-browser.log 2>&1 &
          echo $! >/tmp/forwext-browser.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8123/build/browser-fixtures/guest.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/forwext-browser.log
          exit 1

      - name: Run responsive and accessibility browser regression
        run: npm run browser:smoke
        env:
          FORWEXT_BROWSER_BASE_URL: http://127.0.0.1:8123

      - name: Upload representative browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-regression
          path: build/browser-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare a real installed browser runtime
        env:
          FORWEXT_TEST_DB_HOST: 127.0.0.1
          FORWEXT_TEST_DB_PORT: 3308
          FORWEXT_TEST_DB_NAME: forwext_browser_ci
          FORWEXT_TEST_DB_USER: root
          FORWEXT_TEST_DB_PASSWORD: root
          FORWEXT_TEST_CANONICAL_URL: http://localhost:8124
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality/smoke-post-install-web.php
          php tools/browser/seed-minecraft-fixtures.php
          php tools/browser/seed-group-fixtures.php

      - name: Start real Forwext runtime
        shell: bash
        run: |
          set -euo pipefail
          php -S localhost:8124 -t public tools/browser/live-router.php >/tmp/forwext-live-browser.log 2>&1 &
          echo $! >/tmp/forwext-live-browser.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:8124/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/forwext-live-browser.log
          exit 1

      - name: Run real routed browser acceptance
        run: npm run browser:live
        env:
          FORWEXT_BROWSER_LIVE_BASE_URL: http://localhost:8124

      - name: Upload live-route browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-live-route-browser-acceptance
          path: build/browser-live-artifacts/
          if-no-files-found: warn
          retention-days: 14


  release-contract:
    name: Release build contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, pdo, pdo_mysql, mbstring, intl, zip
          coverage: none
          tools: composer:v2

      - name: Resolve development dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Verify full/update release policy
        run: vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Architecture/ReleasePackagingPolicyTest.php

      - name: Verify official SDK, React and Next.js release surfaces exist
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/sdk/package.json
          test -f packages/react-ui/package.json
          test -f frontend/next/package.json
          test -f .github/workflows/build-install-package.yml
